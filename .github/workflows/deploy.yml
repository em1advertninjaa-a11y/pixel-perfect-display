
name: Build and Deploy to FastComet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Inspect build output
        shell: bash
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Vite configuration ==="
          cat vite.config.ts
          echo "=== HTML files outside dependencies ==="
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -type f -name index.html -print
          echo "=== Standard build folders ==="
          for dir in dist build out .output/public; do
            if [ -d "$dir" ]; then
              echo "Found folder: $dir"
              ls -la "$dir"
            fi
          done

      - name: Locate website files
        id: locate
        shell: bash
        run: |
          for dir in dist .output/public build out; do
            if [ -f "$dir/index.html" ]; then
              echo "local_dir=$dir/" >> "$GITHUB_OUTPUT"
              echo "Website found in $dir"
              exit 0
            fi
          done

          echo "No built index.html found."
          echo "Check the Inspect build output logs."
          exit 1

      - name: Deploy to FastComet using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ${{ steps.locate.outputs.local_dir }}
          server-dir: /
