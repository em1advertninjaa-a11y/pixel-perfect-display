
name: Build Chef11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build website
        run: bun run build

      - name: Show build output
        run: |
          echo "=== Server entry ==="
          ls -l .output/server/index.mjs
          echo "=== Public files ==="
          ls -la .output/public
          echo "=== Nitro configuration ==="
          cat .output/nitro.json
