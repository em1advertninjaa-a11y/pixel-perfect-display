
name: Build and Deploy to FastComet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Inspect build output
        shell: bash
        run: |
          echo "=== Project root ==="
          pwd
          ls -la

          echo "=== Vite configuration ==="
          cat vite.config.ts

          echo "=== Public output ==="
          ls -la .output/public 2>&1 || true

          echo "=== Server output ==="
          ls -la .output/server 2>&1 || true

          echo "=== Server files ==="
          find .output/server -maxdepth 3 -type f -print 2>&1 || true

          echo "=== Package scripts ==="
          bun -e 'console.log(JSON.stringify(require("./package.json").scripts, null, 2))'

      - name: Check static website output
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "No index.html found in .output/public."
            echo "Inspect the logs before choosing a deployment method."
            exit 1
          fi

      - name: Deploy to FastComet using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: .output/public/
          server-dir: /
