
name: Build and Deploy to FastComet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Locate website files
        id: locate
        shell: bash
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Package build script ==="
          bun -e 'console.log(JSON.stringify(require("./package.json").scripts, null, 2))'

          for dir in dist .output/public build out; do
            if [ -f "$dir/index.html" ]; then
              echo "Found website in: $dir"
              echo "local_dir=$dir/" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ERROR: No website index.html found in expected build folders."
          echo "Checking other locations:"
          find . -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -type f -name index.html -print
          exit 1

      - name: Deploy to FastComet using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ${{ steps.locate.outputs.local_dir }}
          server-dir: /
